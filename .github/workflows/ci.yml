name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    services:
      elasticsearch:
        image: ghcr.io/cybozu-go/website-operator-elasticsearch:8.19.13.1@sha256:11c0929b2099f44ff2f6ed79949d19e43ffd959d9aa77c2e7d8a1dbeeb55e30f
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example and verify generated search index
        run: pnpm test

      - name: Wait for Elasticsearch
        run: |
          for _ in {1..30}; do
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null; then
              echo "Elasticsearch is up"; exit 0
            fi
            sleep 2
          done
          echo "Elasticsearch did not become ready" >&2; exit 1

      - name: Elasticsearch end-to-end tests
        run: pnpm run test:e2e
